{% comment %}
Section heading block.

  {% include "components/section_header.html" with eyebrow="How it works" title="..." description="..." align="center" %}
{% endcomment %}
<div class="{% if align == 'center' %}mx-auto max-w-2xl text-center{% else %}max-w-2xl{% endif %}">
  {% if eyebrow %}<p class="eyebrow">{{ eyebrow }}</p>{% endif %}
  <h2 class="{% if eyebrow %}mt-3 {% endif %}text-2xl font-semibold tracking-tight sm:text-3xl">{{ title }}</h2>
  {% if description %}
    <p class="mt-3 text-body-lg leading-relaxed text-content-muted sm:text-base">{{ description }}</p>
  {% endif %}
</div>
