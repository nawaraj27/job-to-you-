{% comment %}
Circular score meter (SVG, no JS).

  {% include "components/score_ring.html" with value=78 size=64 label="Resume score" %}

Uses stroke-dasharray on a 100-length circle so `value` maps 1:1 to percent.
{% endcomment %}
{% with size=size|default:64 %}
<div class="relative shrink-0" style="width:{{ size }}px;height:{{ size }}px"
     role="img" aria-label="{{ label|default:'Score' }}: {{ value }} out of 100">
  <svg viewBox="0 0 36 36" class="size-full -rotate-90">
    <circle cx="18" cy="18" r="15.9155" fill="none" stroke="currentColor"
            class="text-hairline" stroke-width="2.5"></circle>
    <circle cx="18" cy="18" r="15.9155" fill="none" stroke="currentColor"
            class="{% if value >= 80 %}text-success{% elif value >= 60 %}text-warning{% else %}text-danger{% endif %}"
            stroke-width="2.5" stroke-linecap="round"
            stroke-dasharray="{{ value }} 100"></circle>
  </svg>
  <span class="absolute inset-0 grid place-items-center text-sm font-semibold tabular-nums">{{ value }}</span>
</div>
{% endwith %}
