# Local development stack (SRS §17.2).
#
# Postgres and Redis run here; Django runs on the host so the edit-reload loop
# stays fast and the debugger attaches normally. `pgvector/pgvector:pg16` is the
# official image with the extension already built, so `CREATE EXTENSION vector`
# in apps/common/migrations/0001 succeeds without a build step.
#
#   docker compose up -d
#   python manage.py migrate
#   python manage.py runserver 127.0.0.1:8137
#
# Port 8137 rather than 8000: 8000 is blocked on the current dev machine.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careerai
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai
    # Published on 5433, not 5432: a native PostgreSQL service is a common
    # thing to already have installed, and it would silently shadow this
    # container — the connection succeeds, against the wrong server, with a
    # confusing "role does not exist". config/settings/dev.py defaults to 5433
    # to match. CI has no such collision and uses 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerai -d careerai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # volatile-lru evicts only keys with a TTL: cache and session entries,
    # both recoverable from PostgreSQL. Broker keys have no TTL and are never
    # evicted, so a memory spike cannot silently drop queued work. Persistence
    # stays off deliberately — nothing durable lives here any more (ADR-A35).
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Real scanning locally is opt-in: the daemon is ~1GB of signatures and most
  # work does not touch uploads. Start it with `--profile scanning` and set
  # FILES_SCANNER=apps.files.scanning.ClamAVScanner to exercise the production
  # path. Without it, dev uses AllowAllScanner, which a system check refuses to
  # allow with DEBUG off (apps/files/checks.py).
  clamav:
    image: clamav/clamav:stable
    profiles: ["scanning"]
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
